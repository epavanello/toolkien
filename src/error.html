<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Something went wrong · Toolkien</title>
		<!-- Last-resort page, used only when the app itself cannot render (no scripts, no assets) -->
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fafafa;
				--fg: #171717;
				--muted: #737373;
				--border: #e5e5e5;
				--accent: #2563eb;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0a0a0a;
					--fg: #fafafa;
					--muted: #a3a3a3;
					--border: #262626;
					--accent: #60a5fa;
				}
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--fg);
				font:
					14px/1.5 ui-sans-serif,
					system-ui,
					sans-serif;
			}
			main {
				max-width: 28rem;
				padding: 2rem 1rem;
				text-align: center;
			}
			.status {
				font: 500 12px ui-monospace, monospace;
				letter-spacing: 0.05em;
				color: var(--muted);
			}
			h1 {
				margin: 0.5rem 0;
				font-size: 1.5rem;
				letter-spacing: -0.01em;
			}
			p {
				color: var(--muted);
			}
			a {
				display: inline-block;
				margin: 0.25rem;
				padding: 0.45rem 0.75rem;
				border: 1px solid var(--border);
				border-radius: 0.375rem;
				color: var(--fg);
				text-decoration: none;
			}
			a:first-of-type {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="status">Error %sveltekit.status%</p>
			<h1>Something went wrong</h1>
			<p>%sveltekit.error.message%</p>
			<p>Try again in a moment, or start again from the home page.</p>
			<a href="/">Home</a>
			<a href="/docs">Docs</a>
		</main>
	</body>
</html>
