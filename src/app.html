<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Applies the saved light/dark mode before paint (mode-watcher runs with head injection
		disabled so this script can carry the CSP nonce) -->
		<script nonce="%sveltekit.nonce%">
			(() => {
				const mode = localStorage.getItem('mode-watcher-mode') ?? 'system';
				const light =
					mode === 'light' ||
					(mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.classList.toggle('dark', !light);
				document.documentElement.style.colorScheme = light ? 'light' : 'dark';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
